<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPS FLUXO LIVE</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Tela de entrada -->
  <div id="join-screen" class="screen">
    <div class="card">
      <h1 class="logo-text">💜UPS FLUXO</h1>
      <form id="join-form">
        <label for="name-input">Seu nome</label>
        <input id="name-input" type="text" placeholder="Como você quer ser chamado?" maxlength="40" required>

        <label for="room-input">Código da sala</label>
        <input id="room-input" type="text" placeholder="ex: reuniao-da-galera" maxlength="40" required>

        <button type="submit">Entrar na sala</button>
      </form>
      <p class="hint">Se a sala não existir, ela será criada automaticamente. Compartilhe o mesmo código com quem você quer chamar.</p>
      <p class="site-signature">Site desenvolvido por .patricktoussaint</p>
    </div>
  </div>

  <!-- Sala -->
  <div id="room-screen" class="screen hidden">
    <div class="room-layout">
      <div class="video-area">
        <div class="player-wrap">
          <video id="remote-video" autoplay playsinline></video>
          <p id="waiting-msg" class="hint waiting-overlay">Aguardando o host iniciar a transmissão de tela...</p>
        </div>

        <div class="video-actions">
          <button id="fullscreen-btn" type="button">⛶ Tela cheia</button>
        </div>

        <div id="host-controls" class="hidden">
          <label for="quality-select" class="host-controls-label">Qualidade da transmissão</label>
          <div class="host-controls-row">
            <select id="quality-select">
              <option value="economy">Economia (720p · 15fps) — mais estável com muita gente</option>
              <option value="balanced" selected>Equilibrada (900p · 24fps)</option>
              <option value="high">Alta (1080p · 30fps) — exige boa internet de upload</option>
            </select>
            <button id="share-btn" type="button">🖥️ Compartilhar tela</button>
            <button id="stop-share-btn" type="button" class="hidden danger-btn">Parar transmissão</button>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <h3>Sala: <span id="room-name-display"></span></h3>
        <h4>Participantes (<span id="participant-count">0</span>)</h4>
        <ul id="participant-list"></ul>
        <p class="site-signature sidebar-signature">Site desenvolvido por .patricktoussaint</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
