<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPS FLUXO LIVE</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Tela de entrada -->
  <div id="join-screen" class="screen">
    <div class="card">
      <h1 class="logo-text">💜UPS FLUXO</h1>
      <form id="join-form">
        <label for="name-input">Seu nome</label>
        <input id="name-input" type="text" placeholder="Como você quer ser chamado?" maxlength="40" required>

        <label for="room-input">Código da sala</label>
        <input id="room-input" type="text" placeholder="ex: reuniao-da-galera" maxlength="40" required>

        <button type="submit">Entrar na sala</button>
      </form>
      <p class="hint">Se a sala não existir, ela será criada automaticamente. Compartilhe o mesmo código com quem você quer chamar.</p>
    </div>
  </div>

  <!-- Sala -->
  <div id="room-screen" class="screen hidden">
    <div class="room-layout">
      <div class="video-area">
        <div class="player-wrap">
          <div id="yt-container" class="hidden">
            <div id="player"></div>
            <div id="player-block" class="hidden"></div>
          </div>
          <video id="remote-video" autoplay playsinline class="hidden"></video>
          <button id="unlock-audio-btn" type="button" class="hidden unlock-audio-btn">🔊 Ativar áudio</button>
          <p id="waiting-msg" class="hint waiting-overlay">Aguardando o host iniciar uma transmissão...</p>
        </div>

        <div class="video-actions">
          <select id="yt-quality-select" class="hidden" title="Qualidade do vídeo">
            <option value="default">Qualidade: Automática</option>
            <option value="hd1080">1080p</option>
            <option value="hd720">720p</option>
            <option value="large">480p</option>
            <option value="medium">360p</option>
            <option value="small">240p</option>
          </select>
          <button id="fullscreen-btn" type="button">⛶ Tela cheia</button>
        </div>

        <div id="host-controls" class="hidden">
          <div class="mode-tabs">
            <button type="button" id="tab-screen-btn" class="mode-tab active">🖥️ Compartilhar tela</button>
            <button type="button" id="tab-youtube-btn" class="mode-tab">▶️ Assistir YouTube</button>
          </div>

          <div id="host-screen-panel" class="host-panel">
            <label class="host-controls-label" for="screen-quality-select">Qualidade da transmissão</label>
            <div class="host-controls-row">
              <select id="screen-quality-select">
                <option value="economy">Economia (720p · 15fps) — mais estável com muita gente</option>
                <option value="balanced" selected>Equilibrada (900p · 24fps)</option>
                <option value="high">Alta (1080p · 30fps) — exige boa internet de upload</option>
              </select>
              <button id="share-btn" type="button">🖥️ Compartilhar tela</button>
              <button id="stop-share-btn" type="button" class="hidden danger-btn">Parar transmissão</button>
            </div>
          </div>

          <div id="host-youtube-panel" class="host-panel hidden">
            <div class="host-controls-row">
              <input id="video-url-input" type="text" placeholder="Cole o link do YouTube aqui...">
              <button id="load-video-btn" type="button">Carregar vídeo</button>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <h3>Sala: <span id="room-name-display"></span></h3>
        <h4>Participantes (<span id="participant-count">0</span>)</h4>
        <ul id="participant-list"></ul>
        <button id="close-room-btn" type="button" class="hidden danger-btn close-room-btn">Encerrar sala</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="client.js"></script>
</body>
</html>
